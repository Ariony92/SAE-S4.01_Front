<section id="messageErreur" [hidden]="messageErreur === ''">
  <p id="texteErreur">{{ messageErreur }}</p>
</section>

<section id="contenuPage" [hidden]="messageErreur !== ''">
  <h2 id="titreTable">Table : {{ nomTable }}</h2>

  <section id="listeAttributs">
    <h3>Attributs :</h3>
    <ul>
      <li *ngFor="let attribut of attributs">
        {{ attribut.nom.toUpperCase() }}
        <button (click)="supprimerAttribut(attribut.nom)">Supprimer</button>
      </li>
    </ul>
  </section>

  <section id="listeDonnees">
    <h3>Données :</h3>
    <table>
      <thead>
      <tr>
        <th *ngFor="let attribut of attributs">
          <div class="th-content">
            <span>{{ attribut.nom }}</span>
            <app-filtre [nomTable]="nomTable" [colonne]="attribut.nom" [type]="attribut.type"></app-filtre>
          </div>
        </th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let ligne of donnees">
        <td *ngFor="let attribut of attributs">{{ ligne[attribut.nom] }}</td>
        <td>
          <button (click)="SupprimerInsertion(ligne)">Supprimer</button>
        </td>
      </tr>
      </tbody>
    </table>
  </section>
</section>
