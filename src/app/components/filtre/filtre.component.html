<button id="button" (click)="formualire()">
    <img width="14" height="14" src="https://img.icons8.com/ios/50/search--v1.png" alt="search"/>
</button> 

@if(showForm){
    @if(types==='date'){
        <form id="formDate" #scaleForm="ngForm" (ngSubmit)="onSubmit(scaleForm )">
            <label>Date Min :</label>
            <input type="date"  name="minValue" ngModel >
            <label>Date Max :</label>
            <input type="date"  name="maxValue" ngModel >
            <button type="submit" [disabled]="scaleForm.invalid"></button>
        </form>
    }
    @else{
        <form id="formString"#barreRecherheForm="ngForm" (ngSubmit)="onSubmit(barreRecherheForm)">
            <label for="search">Rechercher :</label>
            <input type="text" name="recherche"ngModel required/>
            <button type="submit" [disabled]="barreRecherheForm.invalid"></button>
        </form>
    }

    
}
