<h2>Importer des données :</h2>

<p>Seules les insertions au format script SQL sont acceptées</p>

<form (ngSubmit)="envoyer()">
  <textarea
    [(ngModel)]="script"
    name="sqlScript"
    rows="25"
    cols="200"
    placeholder="INSERT INTO ..."
    required
  ></textarea>
  <br />
  <button type="submit" title="Cliquez pour importer vos données SQL">Valider</button>

</form>

<p class="msg">{{ message }}</p>
